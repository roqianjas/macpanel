# nginx utama untuk dev lokal (*.lab). Satu file per site di ./sites/*.conf
worker_processes auto;
events { worker_connections 1024; }
http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Host tidak dikenal: tolak
    server { listen 80 default_server; listen [::]:80 default_server; return 444; }
    server {
        listen 443 ssl default_server; listen [::]:443 ssl default_server;
        ssl_reject_handshake on;
    }

    include __HOME__/MacPanel/server/nginx/sites/*.conf;
}
